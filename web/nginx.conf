limit_req_zone $binary_remote_addr zone=perip:10m rate=30r/s;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self'; style-src 'self'; script-src 'self'; frame-ancestors 'none'" always;

    limit_req zone=perip burst=120 nodelay;

    location / {
        try_files $uri $uri/ =404;
    }
    location = /downloads/manifest.json {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }
    # Los archivos no se sirven directos: pasan por /api/download/<sistema>, que cuenta la descarga
    location /downloads/ {
        return 404;
    }
    location /downloads-files/ {
        internal;
        alias /usr/share/nginx/html/downloads/;
    }
    location /api/ {
        proxy_pass http://counter:8000;
    }
    location ~ /\. {
        return 404;
    }
}
