# Web de Operación Halcón: portada y descargas (nginx) y contador de descargas (Python, solo números).
name: halcon
services:
  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HALCON_PORT:-8080}:80"
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    mem_limit: 64m
    depends_on:
      - counter
  counter:
    image: python:3.12-alpine
    restart: unless-stopped
    command: python /app/counter.py
    volumes:
      - ./counter:/app:ro
      - ./site/downloads:/downloads:ro
      - counter-data:/data
    mem_limit: 64m
volumes:
  counter-data:
networks:
  default:
    ipam:
      config:
        - subnet: ${HALCON_SUBNET:-172.30.60.0/24}
